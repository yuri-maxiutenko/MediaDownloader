name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Nerdbank.GitVersioning needs the full history to compute the version height.
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test MediaDownloader.Tests/MediaDownloader.Tests.csproj -c Release -p:Platform=x64

      - name: Build installer
        run: dotnet build Installers/MediaDownloaderSetup/MediaDownloaderSetup.wixproj -c Release -p:Platform=x64

      - name: Resolve version
        id: nbgv
        shell: pwsh
        run: |
          dotnet tool restore
          $version = dotnet nbgv get-version -v SemVer2
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Archive portable build
        shell: pwsh
        run: Compress-Archive -Path "Installers/MediaDownloaderSetup/publish/Release/*" -DestinationPath "out/MediaDownloader-${{ steps.nbgv.outputs.version }}-win-x64.zip"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.nbgv.outputs.version }}"
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$version" }
          Rename-Item "out/MediaDownloaderSetup.msi" "MediaDownloaderSetup-$version.msi"
          gh release create $tag `
            "out/MediaDownloaderSetup-$version.msi" `
            "out/MediaDownloader-$version-win-x64.zip" `
            --title "Media Downloader $version" `
            --generate-notes `
            --draft
